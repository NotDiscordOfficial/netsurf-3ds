name: Nintendo 3DS build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate 3DSX and CIA packages
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native generators and makerom
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y bison flex gperf libpng-dev libjpeg62-turbo-dev
          curl -fsSL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          echo 'dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970  /tmp/makerom.zip' | sha256sum -c -
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          install -m 0755 /tmp/makerom/makerom /usr/local/bin/makerom
          test -x /usr/local/bin/makerom

      - name: Remove checked-in build outputs
        run: make clean

      - name: Build Old 3DS compatible binary and CIA variants
        run: make -j"$(nproc)" build NOCIA=

      - name: Validate package outputs
        run: |
          test -s nsfb.3dsx
          test -s netsurf/nsfb.cia
          test -s netsurf/nsfb_himem.cia
          python3 - <<'PY'
          from pathlib import Path
          import struct

          for path in (Path("netsurf/nsfb.cia"), Path("netsurf/nsfb_himem.cia")):
              with path.open("rb") as cia:
                  header_size = struct.unpack("<I", cia.read(4))[0]
              if header_size != 0x2020 or path.stat().st_size <= header_size:
                  raise SystemExit(f"Invalid CIA container: {path}")
              print(f"Validated {path} ({path.stat().st_size} bytes)")
          PY

      - name: Package browser resources for 3DSX users
        run: (cd netsurf && zip -qr ../resources.zip resources)

      - name: Validate resources archive layout
        run: unzip -Z1 resources.zip | grep -q '^resources/'

      - name: Upload installable builds
        uses: actions/upload-artifact@v4
        with:
          name: netsurf-3ds-build
          if-no-files-found: error
          path: |
            nsfb.3dsx
            netsurf/nsfb.cia
            netsurf/nsfb_himem.cia
            resources.zip
