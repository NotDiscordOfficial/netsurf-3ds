<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Out-of-flow margin collapse regression</title>
<style>
body { font: 16px sans-serif; }
.flow { height: 32px; padding: 4px; border: 1px solid #222; }
.before { margin-bottom: 8px; background: #bde7ff; }
.positioned {
    position: absolute;
    top: 24px;
    left: 240px;
    width: 100px;
    height: 12px;
    margin-top: 160px;
    margin-bottom: 160px;
    background: #ffbf7f;
}
.after { margin-top: 12px; background: #c8f5c8; }
</style>
</head>
<body>
<h1>Out-of-flow margin collapse regression</h1>
<p>The green block should follow the blue block after a 12px collapsed gap.
The orange absolute block is separate; its 160px margins must not move the green block.</p>
<div class="flow before">Blue: in-flow block</div>
<div class="positioned">Orange: absolute</div>
<div class="flow after">Green: in-flow block</div>
</body>
</html>
